<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 梱包依頼の入口ページ(D-79)。アプリ(Apps Script)をこのページの枠の中で開くので、Google のバーが出ない。
     URL: ?s=デプロイID&k=アクセスキー(アクセス用URLを表示で出るもの)。秘密の値はこのファイルに書かない -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="梱包依頼">
<meta name="referrer" content="no-referrer">
<title>梱包依頼</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; }
  #app { display: block; border: 0; width: 100%; height: 100%; }
  #msg { font: 15px/1.6 sans-serif; color: #1f2328; padding: 24px 16px; }
</style>
</head>
<body>
<iframe id="app" title="梱包依頼" allow="clipboard-write"></iframe>
<p id="msg" hidden></p>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('s') || '';
  // デプロイIDの形(英数字・-・_)だけ受け付ける。ほかのサイトは開かない
  if (!/^[A-Za-z0-9_-]{10,}$/.test(id)) {
    var m = document.getElementById('msg');
    m.textContent = 'URLが正しくありません。配られたURL(オーナーはスプレッドシートのメニュー「梱包依頼 → アクセス用URLを表示」のURL)から開いてください。';
    m.hidden = false;
    return;
  }
  q.delete('s');
  var rest = q.toString();
  document.getElementById('app').src = 'https://script.google.com/macros/s/' + id + '/exec' + (rest ? '?' + rest : '');
})();
</script>
</body>
</html>
